name: Daily stock digest

on:
  schedule:
    # Cron runs in UTC. 06:13 UTC = 07:13 Zagreb in winter (CET), 08:13 in summer (CEST).
    # Off the top of the hour on purpose: GitHub delays/drops many :00 runs under load.
    - cron: "13 6 * * *"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send digest
        run: python main.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
